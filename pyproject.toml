[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irag"
version = "4.50.0"
description = "Project Knowledge Base — relational memory for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Karan Garg" }]
keywords = ["ai", "coding-agents", "memory", "sqlite", "context", "claude", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Karang1908/irag"
Documentation = "https://karang1908.github.io/irag/"
Repository = "https://github.com/Karang1908/irag"
Changelog = "https://github.com/Karang1908/irag/blob/main/CHANGELOG.md"
Issues = "https://github.com/Karang1908/irag/issues"

[project.scripts]
irag = "irag.cli:main"

[tool.setuptools]
packages = ["irag"]
include-package-data = false

[tool.setuptools.package-data]
irag = ["assets/*.html", "assets/*.js", "assets/*.md", "assets/docs/*.md"]

# Pin the rule set explicitly. Ruff's defaults widen between releases, and
# with an unpinned install that silently redefines what CI enforces: the
# gate went from clean to 109 findings across rule families nobody chose
# (bandit, refurb, pylint, isort) purely because a newer ruff shipped.
# This is ruff's documented default selection, stated so it stays fixed;
# widening it is a deliberate decision, not something upstream does for us.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"

# tiktoken is an optional accelerator for token counting — irag has zero
# runtime dependencies and falls back to its own estimator when the import
# fails, which is the normal case. Newer mypy treats the missing stub as an
# error, so say out loud that its absence is expected.
[[tool.mypy.overrides]]
module = ["tiktoken"]
ignore_missing_imports = true
