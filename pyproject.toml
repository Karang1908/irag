[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irag"
version = "4.45.0"
description = "Project Knowledge Base — relational memory for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Karan Garg" }]
keywords = ["ai", "coding-agents", "memory", "sqlite", "context", "claude", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Karang1908/irag"
Documentation = "https://karang1908.github.io/irag/"
Repository = "https://github.com/Karang1908/irag"
Changelog = "https://github.com/Karang1908/irag/blob/main/CHANGELOG.md"
Issues = "https://github.com/Karang1908/irag/issues"

[project.scripts]
irag = "irag.cli:main"

[tool.setuptools]
packages = ["irag"]
include-package-data = false

[tool.setuptools.package-data]
irag = ["assets/*.html", "assets/*.md", "assets/docs/*.md"]
