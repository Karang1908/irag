<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="1200" height="340" rx="18" fill="#08090c" stroke="#22262e"/>
  <!-- left: copy -->
  <rect x="70" y="76" width="24" height="2" fill="#58a6ff"/>
  <text x="106" y="83" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="4" fill="#707885">PLUGGABLE MEMORY FOR AI CODING AGENTS</text>
  <text x="66" y="196" font-size="104" font-weight="800" letter-spacing="-4" fill="#f2f3f5">irag<tspan fill="#58a6ff">.</tspan></text>
  <text x="70" y="243" font-size="16.5" fill="#a2a9b4">Your agent stops re-learning the codebase every session — irag remembers files,</text>
  <text x="70" y="267" font-size="16.5" fill="#a2a9b4">changes, decisions — fact-checked against the real code, so it can never quietly lie.</text>
  <text x="70" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#707885">3k-token briefings  ·  ~150-token resumes  ·  1 SQLite file  ·  0 dependencies</text>
  <!-- right: the code map draws itself -->
  <g transform="translate(742,-4) scale(0.92)">
    <g stroke="#3a4150" stroke-width="1" fill="none">
      <path d="M296 64L138 84" stroke-dasharray="162" stroke-dashoffset="162"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.10s" fill="freeze"/></path>
      <path d="M296 64L218 178" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.18s" fill="freeze"/></path>
      <path d="M296 64L352 150" stroke-dasharray="105" stroke-dashoffset="105"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.26s" fill="freeze"/></path>
      <path d="M138 84L218 178" stroke-dasharray="126" stroke-dashoffset="126"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.34s" fill="freeze"/></path>
      <path d="M218 178L352 150" stroke-dasharray="139" stroke-dashoffset="139"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.42s" fill="freeze"/></path>
      <path d="M218 178L92 190" stroke-dasharray="129" stroke-dashoffset="129"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.50s" fill="freeze"/></path>
      <path d="M92 190L172 272" stroke-dasharray="117" stroke-dashoffset="117"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.58s" fill="freeze"/></path>
      <path d="M218 178L172 272" stroke-dasharray="107" stroke-dashoffset="107"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.66s" fill="freeze"/></path>
      <path d="M296 64L334 262" stroke-dasharray="204" stroke-dashoffset="204"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.74s" fill="freeze"/></path>
      <path d="M218 178L334 262" stroke-dasharray="145" stroke-dashoffset="145"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.82s" fill="freeze"/></path>
      <path d="M296 64L64 306" stroke-dasharray="338" stroke-dashoffset="338"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.90s" fill="freeze"/></path>
      <path d="M334 262L252 332" stroke-dasharray="110" stroke-dashoffset="110"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="0.98s" fill="freeze"/></path>
      <path d="M92 190L252 332" stroke-dasharray="216" stroke-dashoffset="216"><animate attributeName="stroke-dashoffset" to="0" dur="0.7s" begin="1.06s" fill="freeze"/></path>
    </g>
    <!-- live data flowing toward the hub, forever -->
    <g stroke="#58a6ff" stroke-width="1.6" fill="none" opacity="0">
      <animate attributeName="opacity" to="0.55" dur="0.6s" begin="2s" fill="freeze"/>
      <path d="M296 64L218 178" stroke-dasharray="3 10" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="0" to="-130" dur="3s" begin="2.2s" repeatCount="indefinite"/></path>
      <path d="M92 190L218 178" stroke-dasharray="3 10" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="0" to="-130" dur="3.6s" begin="2.6s" repeatCount="indefinite"/></path>
    </g>
    <circle cx="218" cy="178" r="11" fill="none" stroke="#58a6ff" stroke-opacity="0.35">
      <animate attributeName="r" values="11;19" dur="2.4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0" dur="2.4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <g fill="#dfe3e8">
      <circle cx="296" cy="64" r="0"><animate attributeName="r" to="3.5" dur="0.3s" begin="1.0s" fill="freeze"/></circle>
      <circle cx="138" cy="84" r="0"><animate attributeName="r" to="3" dur="0.3s" begin="1.05s" fill="freeze"/></circle>
      <circle cx="218" cy="178" r="0" fill="#58a6ff"><animate attributeName="r" to="5" dur="0.3s" begin="1.1s" fill="freeze"/></circle>
      <circle cx="352" cy="150" r="0"><animate attributeName="r" to="3" dur="0.3s" begin="1.15s" fill="freeze"/></circle>
      <circle cx="92" cy="190" r="0"><animate attributeName="r" to="3" dur="0.3s" begin="1.2s" fill="freeze"/></circle>
      <circle cx="172" cy="272" r="0"><animate attributeName="r" to="3" dur="0.3s" begin="1.25s" fill="freeze"/></circle>
      <circle cx="334" cy="262" r="0"><animate attributeName="r" to="3" dur="0.3s" begin="1.3s" fill="freeze"/></circle>
      <circle cx="64" cy="306" r="0"><animate attributeName="r" to="2.5" dur="0.3s" begin="1.35s" fill="freeze"/></circle>
      <circle cx="252" cy="332" r="0"><animate attributeName="r" to="2.5" dur="0.3s" begin="1.4s" fill="freeze"/></circle>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#707885" opacity="0">
      <text x="306" y="60">api.py</text>
      <text x="88" y="76">auth.py</text>
      <text x="234" y="172">db.py</text>
      <text x="362" y="146">models.py</text>
      <text x="28" y="180">worker.py</text>
      <text x="116" y="288">cache.py</text>
      <text x="344" y="258">cli.py</text>
      <text x="40" y="326">tests/</text>
      <text x="262" y="340">config.toml</text>
      <animate attributeName="opacity" to="0.95" dur="0.5s" begin="1.5s" fill="freeze"/>
    </g>
  </g>
</svg>
